<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FileOrganizerPro Checkout</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #1f1f1f;
    }
    main {
      width: min(92vw, 520px);
      box-sizing: border-box;
      padding: 28px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    #status { margin: 14px 0; line-height: 1.6; }
    #details { margin: 16px 0; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font: inherit;
      cursor: pointer;
      background: #6f42c1;
      color: white;
    }
    button:disabled { opacity: .55; cursor: default; }
    .hidden { display: none; }
    .error { color: #b42318; }
    .success { color: #067647; }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #f1f1f1; }
      main { background: #1e1e1e; }
    }
  </style>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <meta name="referrer" content="no-referrer">
  <script src="config.js?v=20261022"></script>
</head>
<body>
  <main>
    <h1>FileOrganizerPro</h1>
    <div id="status" role="status" aria-live="polite">Loading checkout…</div>
    <div id="details"></div>
    <button id="payButton" class="hidden" type="button">Pay with Pi</button>
    <p style="font-size:12px">Checkout version: 2026-10-23-recovery4</p>
    <details open style="text-align:left;margin-top:20px">
      <summary>Payment diagnostics (no tokens)</summary>
      <pre id="payment-diagnostics" dir="ltr" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px" aria-live="polite"></pre>
    </details>
  </main>
  <script src="recovery-text.js?v=20261023-recovery4"></script>
  <script src="checkout.js?v=20261023-recovery4"></script>
</body>
</html>
